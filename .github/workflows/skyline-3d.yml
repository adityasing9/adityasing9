name: 3D GitHub Contribution Skyline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/skyline-3d.yml'

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D Contribution Skyline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): update 3D contribution skyline [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
