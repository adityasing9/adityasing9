name: Update GitHub Activity And Languages

on:
  push:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Update activity and languages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          username = "adityasing9"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          repos = []
          page = 1
          while True:
              batch = get(f"https://api.github.com/users/{username}/repos?per_page=100&page={page}&type=owner")
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          language_totals = {}
          for repo in repos:
              if repo.get("fork"):
                  continue
              try:
                  langs = get(repo["languages_url"])
                  for language, bytes_count in langs.items():
                      language_totals[language] = language_totals.get(language, 0) + bytes_count
              except Exception:
                  pass

          top = sorted(language_totals.items(), key=lambda x: x[1], reverse=True)[:6]
          total = sum(language_totals.values()) or 1

          rows = []
          for i, (language, amount) in enumerate(top):
              pct = amount / total * 100
              y = 130 + i * 35
              width = max(8, int(pct * 6.4))
              rows.append(
                  f'<text x="48" y="{y}" fill="#e4e4e7" font-family="Arial,sans-serif" font-size="14">{language}</text>'
                  f'<rect x="190" y="{y-13}" width="{width}" height="10" rx="5" fill="url(#g)"/>'
                  f'<text x="850" y="{y}" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="14">{pct:.1f}%</text>'
              )

          language_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img">
          <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
          <rect width="1000" height="360" rx="24" fill="#09090b" stroke="#27272a"/>
          <rect x="1" y="1" width="998" height="5" rx="3" fill="url(#g)"/>
          <text x="48" y="55" fill="#fafafa" font-family="Arial,sans-serif" font-size="24" font-weight="700">MOST USED LANGUAGES</text>
          <text x="48" y="82" fill="#71717a" font-family="Arial,sans-serif" font-size="13">calculated from repository code • refreshed automatically</text>
          <g id="languages">LANGUAGE_ROWS</g>
          </svg>'''
          language_svg = language_svg.replace("LANGUAGE_ROWS", "".join(rows) if rows else '<text x="48" y="130" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="15">No language data available</text>')

          with open("profile/languages.svg", "w", encoding="utf-8") as f:
              f.write(language_svg)

          user = get(f"https://api.github.com/users/{username}")
          total_stars = sum(r.get("stargazers_count", 0) for r in repos)

          path = "profile/github-activity.svg"
          with open(path, "r", encoding="utf-8") as f:
              activity = f.read()

          activity = re.sub(r'(id="repos"[^>]*>)\d+', rf'\g<1>{user["public_repos"]}', activity)
          activity = re.sub(r'(id="stars"[^>]*>)\d+', rf'\g<1>{total_stars}', activity)

          with open(path, "w", encoding="utf-8") as f:
              f.write(activity)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-activity.svg profile/languages.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub profile metrics"
          git push
