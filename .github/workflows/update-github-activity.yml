name: Update GitHub Activity Panel

on:
  push:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate live activity SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          username = "adityasing9"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          user = get(f"https://api.github.com/users/{username}")
          repos = []
          page = 1
          while True:
              batch = get(f"https://api.github.com/users/{username}/repos?per_page=100&page={page}&type=owner")
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          total_stars = sum(r.get("stargazers_count", 0) for r in repos)

          path = "profile/github-activity.svg"
          with open(path, "r", encoding="utf-8") as f:
              svg = f.read()

          svg = re.sub(r'(id="repos"[^>]*>)[^<]*(</text>)', rf'\g<1>{user["public_repos"]}\g<2>', svg)
          svg = re.sub(r'(id="stars"[^>]*>)[^<]*(</text>)', rf'\g<1>{total_stars}+\g<2>', svg)
          svg = re.sub(r'(id="followers"[^>]*>)[^<]*(</text>)', rf'\g<1>{user["followers"]} followers\g<2>', svg)

          with open(path, "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit changes
        run: |
          git config user.name "adityasing9"
          git config user.email "206208054+adityasing9@users.noreply.github.com"
          git add profile/github-activity.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub activity panel"
          git push
