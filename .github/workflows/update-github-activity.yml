name: Update GitHub Activity Panel

on:
  push:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate live activity SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          username = "adityasing9"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          user = get(f"https://api.github.com/users/{username}")
          repos = []
          page = 1
          while True:
              batch = get(f"https://api.github.com/users/{username}/repos?per_page=100&page={page}&type=owner")
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          total_stars = sum(r.get("stargazers_count", 0) for r in repos)
          featured_names = ["Smart-AI-Study-Assistant", "ToolKit", "SettleHub", "Pass", "RCPC", "GlobalCart"]
          featured = [(name, next((r.get("stargazers_count", 0) for r in repos if r["name"] == name), 0)) for name in featured_names]
          featured_text = "  •  ".join(f"{name}: {stars}★" for name, stars in featured[:4])

          path = "profile/github-activity.svg"
          with open(path, "r", encoding="utf-8") as f:
              svg = f.read()

          svg = svg.replace('id="repos" x="28" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">--',
                            f'id="repos" x="28" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">{user["public_repos"]}')
          svg = svg.replace('id="stars" x="28" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">--',
                            f'id="stars" x="28" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">{total_stars}')
          svg = svg.replace('id="followers" x="28" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">--',
                            f'id="followers" x="28" y="88" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">{user["followers"]}')
          svg = svg.replace('id="featured" x="28" y="78" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">--',
                            f'id="featured" x="28" y="78" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">{featured_text}')
          with open(path, "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-activity.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub activity panel"
          git push
