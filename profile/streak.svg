<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="GitHub contribution streak statistics">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/>
    <stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/>
    <stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

<rect width="1200" height="300" rx="28" fill="#09090b"/>
<rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#27272a"/>

<rect x="42" y="28" width="1116" height="4" rx="2" fill="url(#accent)"/>
<circle cx="600" cy="30" r="18" fill="#7c3aed" opacity=".18" filter="url(#soft)"/>

<!-- Contributions -->
<rect x="42" y="52" width="350" height="184" rx="20" fill="#111113" stroke="#242428"/>
<text x="70" y="87" fill="#71717a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CONTRIBUTIONS</text>
<text x="70" y="145" fill="#fafafa" font-family="Arial,sans-serif" font-size="52" font-weight="700">932</text>
<text x="70" y="176" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="15">in the last 12 months</text>
<rect x="70" y="201" width="86" height="3" rx="1.5" fill="#06b6d4"/>

<!-- Current streak -->
<rect x="425" y="52" width="350" height="184" rx="20" fill="#111113" stroke="#242428"/>
<circle cx="600" cy="126" r="48" fill="none" stroke="#27272a" stroke-width="8"/>
<circle cx="600" cy="126" r="48" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276 302" transform="rotate(-90 600 126)"/>
<text x="600" y="137" text-anchor="middle" fill="#fafafa" font-family="Arial,sans-serif" font-size="32" font-weight="700">11</text>
<text x="600" y="87" text-anchor="middle" fill="#a78bfa" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURRENT</text>
<text x="600" y="198" text-anchor="middle" fill="#fafafa" font-family="Arial,sans-serif" font-size="16" font-weight="700">day streak</text>
<text x="600" y="220" text-anchor="middle" fill="#71717a" font-family="Arial,sans-serif" font-size="13">Sep 21 – Oct 1</text>

<!-- Longest streak -->
<rect x="808" y="52" width="350" height="184" rx="20" fill="#111113" stroke="#242428"/>
<text x="836" y="87" fill="#71717a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LONGEST STREAK</text>
<text x="836" y="145" fill="#fafafa" font-family="Arial,sans-serif" font-size="52" font-weight="700">13</text>
<text x="836" y="176" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="15">consecutive days</text>
<rect x="836" y="201" width="86" height="3" rx="1.5" fill="#7c3aed"/>

<text x="600" y="268" text-anchor="middle" fill="#52525b" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2">GITHUB CONTRIBUTION DATA  •  AUTO-SYNCED</text>
</svg>